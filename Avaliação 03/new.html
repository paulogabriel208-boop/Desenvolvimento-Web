<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaBras - Novo Usuário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="icon" type="image/png" href="img/voo-de-aviao.png">
</head>
<body>

    <header>
        <h2 class="topo-logo"><a href="index.html">ViaBras</a></h2>

        <nav class="menu-principal">
            <li class="menu-item"><a href="index.html">Ofertas</a></li>
            <li class="menu-item"><a href="index.html">Destinos</a></li>
            <li class="menu-item"><a href="pacotes.html">Pacotes</a></li>
            <li class="menu-item"><a href="contato.html">Contato</a></li>
            <li class="menu-item"><a href="login.html">Login</a></li>

            <span class="barra-pesquisa">
                <input type="text" name="Pesquisar" placeholder="Pesquise aqui">
            </span>
        </nav>
    </header>

    <main class="conteudo-principal pagina-form">
        <section>
            <h2>Novo Usuário</h2>

            <form action="#" method="post">
                <input type="email" name="email" placeholder="Informe o seu e-mail">
                <input type="password" name="senha" placeholder="Informe a sua senha">
                <input type="text" name="nome" placeholder="Informe o seu nome">

                <select name="tipo">
                    <option>Visitante</option>
                    <option>Turista</option>
                    <option>Cliente VIP</option>
                </select>

                <div>
                    <label><input type="radio" name="preferencia" value="internacional"> Internacional</label>
                    <label><input type="radio" name="preferencia" value="nacional"> Nacional</label>
                    <label><input type="radio" name="preferencia" value="ambos"> Nacional e Internacional</label>
                </div>

                <input type="file">

                <button type="submit">Criar conta</button>
            </form>
        </section>
    </main>


    <footer>
        <h2>ViaBras</h2>
        <p>A ViaBras é uma agencia de viagens que oferece as melhores ofertas e pacotes para você viajar pelo mundo.</p>
        <p>@ 2025 ViaBras. Todos os direitos reservados.</p>

        <div class="social">
            <a href="https://facebook.com" target="_blank">
                <i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://instagram.com" target="_blank">
                <i class="fa-brands fa-instagram"></i></a>
            <a href="https://twitter.com" target="_blank">
                <i class="fa-brands fa-x-twitter"></i></a>
        </div>
    </footer>

</body>
</html>
